[project]
name = "modular-rag-mcp-server"
version = "0.1.0"
description = "Modular RAG MCP Server - A pluggable, observable RAG framework with MCP protocol support"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "mcp>=1.0.0",
    "openai>=1.0.0",
    "chromadb>=0.4.0",
    "langchain-text-splitters>=0.3.0",
    "streamlit>=1.30.0",
    "pymupdf>=1.24.0",
    "markitdown>=0.1.0",
    "sentence-transformers>=3.0.0",
    "torchvision>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server", "src/core", "src/ingestion", "src/libs", "src/observability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (multi-component)",
    "e2e: End-to-end tests (full pipeline)",
]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120
